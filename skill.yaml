name: long-novel-workflow
title: Long Novel Workflow
description: Long serialised fiction workflow skill (v2.4.0). Supports author-gated, full-auto, and user-driven execution for novels of any length, Chinese or English: bible and outline first, golden 3 chapters first, then one chapter at a time with a chapter contract (8 desires + AI auto payoff sizing), blocking hook/desire/anti-placeholder audit, dynamic cast registration, overdue-aware foreshadowing ledger, and per-character knows lists. User-driven mode takes the author's own brief + outline + chapter data (user_submission/), classifies its completeness (L0-L4), validates it with per-beat word budgets, restates it back with gaps sorted into must-ask vs ai-may-fill, derives contracts from it, and checks every chapter for fidelity to it and for contract consistency — locked user fields, frozen arcs, versioned outline revisions with impact lists, no invented chapters. The MCP server exposes the same checks as tools (submitUserOutline / validateSubmission / checkFidelity / checkContract / getSubmissionLevel) and runs the same Python scripts. File-as-truth, only redo the wrong segment, state rollback on revision. Use when the user says "write a novel", "continue chapter N", "import my manuscript", "write it from my outline" or "check continuity". Not for video scripts.
category: Writing
triggers:
