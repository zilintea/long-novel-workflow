name: long-novel-workflow
title: Long Novel Workflow
description: Long serialised fiction workflow skill. One prompt starts a novel of any length, Chinese or English: bible and outline first, golden 3 chapters first, then one chapter at a time with a chapter contract, a blocking hook/desire audit, a foreshadowing ledger and per-character knows lists. File-as-truth, only redo the wrong segment, state rollback on revision. Use when the user says "write a novel", "continue chapter N", "import my manuscript" or "check continuity". Not for video scripts.
category: Writing
triggers:
  - write a novel
  - 写小说
  - continue chapter
  - 续写
  - import my manuscript
  - 导入旧稿
  - check continuity
  - continuity audit
  - foreshadowing
  - 伏笔
include_in_prompt: true
source: original, synthesised from public long-form writing research (2026-11-13) — file-as-truth, chapter contracts, foreshadowing ledgers, knows lists, bounded audit — plus the gates of universal-story-workflow v3.10, translated from video to text. No code or text copied from any surveyed repo.
