source: original, synthesised from public long-form writing research (v1.0.0 2026-11-13, v2.0.0 2026-11-15, v2.1.0 2026-11-16) — file-as-truth, chapter contracts, foreshadowing ledgers, knows lists, bounded audit, dynamic cast growth — plus the gates of universal-story-workflow v3.10, translated from video to text. No code or text copied from any surveyed repo.
